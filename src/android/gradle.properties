org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Reuse task outputs and build modules in parallel; repeat builds are mostly
# cache hits instead of full recompiles
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
# Kotlin's incremental cache keys on relative paths, which cannot be computed
# when the project (D:) and the pub cache (C:) sit on different drives — it
# throws at cache-close time, so the cache is never written and every Kotlin
# compile is a full one anyway. Turning IC off skips the futile bookkeeping.
# The only Kotlin here is MainActivity.kt plus one plugin, so IC buys nothing.
kotlin.incremental=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
