<!-- Supabase Dashboard → Authentication → Emails → Confirm signup
     Paste the body below into the "Message body" field. Kept here because the
     dashboard is not version controlled. -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans TC',sans-serif;background:#F8F4EF;padding:32px 16px;">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border:1px solid #DDD0C0;border-radius:16px;padding:32px;">
    <h1 style="margin:0 0 8px;font-size:22px;color:#A07850;">URniversity</h1>
    <h2 style="margin:0 0 24px;font-size:16px;font-weight:600;color:#2A1E12;">驗證你的帳號</h2>

    <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#2A1E12;">
      請點擊下方按鈕完進行帳號驗證，完成後就能開始使用囉。
    </p>

    <a href="{{ .ConfirmationURL }}"
       style="display:inline-block;background:#A07850;color:#FFFFFF;text-decoration:none;
              padding:12px 28px;border-radius:12px;font-size:15px;font-weight:600;">
      驗證帳號
    </a>

    <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6B5843;">
      按鈕沒反應的話，複製這個連結到瀏覽器：<br>
      <span style="color:#A07850;word-break:break-all;">{{ .ConfirmationURL }}</span>
    </p>

    <hr style="border:none;border-top:1px solid #DDD0C0;margin:24px 0;">

    <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#6B5843;">
      Click the button above to verify your URniversity account.
    </p>

    <p style="margin:0;font-size:13px;line-height:1.6;color:#B09A84;">
      如果這不是你本人的操作，請忽略這封信。<br>
      If you did not sign up, you can safely ignore this email.
    </p>
  </div>
</div>
